<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>交互测试页 · AgentViewer</title>
<style>body{font:16px/1.75 "Segoe UI","Microsoft YaHei",sans-serif;margin:0;color:#24263a;background:#f7f7fb}main{max-width:700px;margin:60px auto;background:white;padding:44px;border:1px solid #e3e4ef;border-radius:10px}h1{font-size:30px}input,textarea{font:inherit;padding:10px;border:1px solid #c8cadd;border-radius:5px;width:90%;display:block;margin:14px 0}button{background:#7263e8;color:white;border:0;padding:10px 22px;border-radius:5px;font:inherit;cursor:pointer}#result{padding:15px;background:#eeeafb;margin:20px 0}.scrollbox{height:140px;overflow:auto;border:1px solid #dedee8;padding:10px}footer{margin-top:800px}</style></head>
<body><input type="password" autocomplete="current-password" value="sample-secret-e2e" aria-label="测试密码字段" style="position:absolute;top:8px;right:12px;width:90px;margin:0;padding:4px"><input type="hidden" value="hidden-secret-e2e"><main><h1>网页交互测试</h1><p id="selectable">这段文字用于验证真实选中片段、鼠标拖动与阅读位置。</p><label for="name">输入内容</label><input id="name" placeholder="支持中文键盘输入"><button id="submit">提交内容</button><div id="result">等待输入</div><textarea id="notes" placeholder="可输入多行文字"></textarea><div class="scrollbox" id="nested"><p>嵌套滚动区域</p><p>第一段</p><p>第二段</p><p>第三段</p><p>第四段</p><p>第五段</p></div><footer><h2>页面底部</h2><p>滚动已经到达新的阅读位置。</p></footer></main><script>document.getElementById('submit').addEventListener('click',()=>{document.getElementById('result').textContent='已提交：'+document.getElementById('name').value})</script></body></html>
